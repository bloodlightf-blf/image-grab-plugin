<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图提取 · 图片预览</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="url(#g)"/>
        <path d="M12 5v8m0 0l-3.5-3.5M12 13l3.5-3.5M6 17h12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
            <stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
      </svg>
      <span>图提取</span>
    </div>

    <div class="actions">
      <span id="stat" class="stat">已选 0 张</span>
      <button id="selectAll" class="ghost">全选</button>
      <button id="invert" class="ghost">反选</button>
      <button id="download" class="primary" disabled>下载选中</button>
    </div>
  </header>

  <div id="progress" class="progress hidden">
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <span id="progressText">0 / 0</span>
  </div>

  <main id="grid" class="grid"></main>

  <div id="empty" class="empty hidden">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 5h16v14H4z" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="9" cy="10" r="1.6" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M4 17l5-5 4 4 3-3 4 4" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <p>暂无图片</p>
    <p class="hint">请先在淘宝 / 京东 / 拼多多商品详情页，点击右下角「获取图片」</p>
  </div>

  <div id="toast" class="toast"></div>

  <script src="gallery.js"></script>
</body>
</html>
